apiVersion: v1
kind: Pod
metadata:
  name: tican-oauth2-users-business-pod
  labels:
    app: tican-oauth2-users-business-pod
spec:
  containers:
    - name: tican-oauth2-clients-business-container
      image: fras200627/tican-oauth2-users-business-api:1.0.0-openapi
      ports:
        - containerPort: 3071
      envFrom:
        - configMapRef:
            name: config-map-defaults
        - configMapRef:
            name: tican-oauth2-users-business-cmap
      volumeMounts:
        - name: tican-oauth2-users-business-persist
          mountPath: /default/tican-oauth2-users-business-pvc
  volumes:
    - name: tican-oauth2-users-business-persist
      persistentVolumeClaim:
        claimName: tican-oauth2-users-business-pvc