apiVersion: v1
kind: Pod
metadata:
  name: tican-discovery-services-pod
  labels:
    app: tican-discovery-services-pod
spec:
  containers:
    - name: tican-discovery-services-pod
      image: fras200627/tican-discovery-services:1.0.0-openapi
      ports:
        - containerPort: 3000
      envFrom:
        - configMapRef:
            name: config-map-defaults
        - configMapRef:
            name: tican-discovery-services-cmap
      volumeMounts:
        - name: tican-discovery-services-persist
          mountPath: /default/tican-discovery-services-pvc
  restartPolicy: Always
  #      restartPolicy: OnFailure
  #      restartPolicy: Never
  volumes:
    - name: tican-discovery-services-persist
      persistentVolumeClaim:
        claimName: tican-discovery-services-pvc