apiVersion: v1
kind: Pod
metadata:
  name: tican-oauth2-users-domain-pod
  labels:
    app: tican-oauth2-users-domain-pod
spec:
  containers:
    - name: tican-oauth2-clients-domain-container
      image: fras200627/tican-oauth2-users-domain-api:1.0.0-openapi
      ports:
        - containerPort: 3081
      envFrom:
        - configMapRef:
            name: config-map-defaults
        - configMapRef:
            name: tican-oauth2-users-domain-cmap
      volumeMounts:
        - name: tican-oauth2-users-domain-persist
          mountPath: /default/tican-oauth2-users-domain-pvc
  volumes:
    - name: tican-oauth2-users-domain-persist
      persistentVolumeClaim:
        claimName: tican-oauth2-users-domain-pvc