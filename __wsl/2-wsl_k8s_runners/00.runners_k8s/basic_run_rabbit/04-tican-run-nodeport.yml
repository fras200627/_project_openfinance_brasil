apiVersion: v1
kind: Service
metadata:
  name: mq-rabbit-nodeport
  labels:
    app: mq-rabbit-nodeport
spec:
  type: NodePort
  clusterIP: 10.152.183.205
  ports:
    - name: http
      protocol: TCP
      port: 15672
      targetPort: 15672
      nodePort: 32672
    - name: amqp
      protocol: TCP
      port: 5672
      targetPort: 5672
      nodePort: 31672
  selector:
    app: mq-rabbit-pod