# ---------------------------------------------------------------
# This script includes volume
# ---------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: tican-eureka-pod
  labels:
    app: tican-eureka-pod
spec:
  containers:
    - name: tican-eureka-pod
      image: fras200627/tican-service-discovery:1.0.0
      volumeMounts:
        - mountPath: /eureka-service
          name: tican-eureka-vol
      ports:
        - containerPort: 5000
      envFrom:
        - configMapRef:
            name: tican-eureka-cmap 
  volumes:
    - name: tican-eureka-vol
      hostPath:
        path: /C/temp/kubernetes/volumes
        type: Directory