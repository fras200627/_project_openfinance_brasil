apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oauth2-users-domain-services
  labels:
    app: oauth2-users-domain-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-users-domain-pod
  template:
    metadata:
      name: oauth2-users-domain-pod
      labels:
        app: oauth2-users-domain-pod
    spec:
      containers:
        - name: oauth2-users-domain-container
          image: fras200627/oauth2-users-domain:1.0.0
          ports:
            - containerPort: 6004
          envFrom:
            - configMapRef:
                name: config-map-defaults
            - configMapRef:
                name: oauth2-users-domain-cmap  
          volumeMounts:
            - name: oauth2-users-domain-persist
              mountPath: /default/oauth2-users-domain-pvc
      volumes:
        - name: oauth2-users-domain-persist
          persistentVolumeClaim:
            claimName: oauth2-users-domain-pvc
  serviceName: oauth2-users-domain-services-stateful
    