apiVersion: v1
kind: Service
metadata:
  name: mq-rabbit-svc
  labels:
    app: mq-rabbit-svc
spec:
  type: ClusterIP
  selector:
    app: mq-rabbit-pod
  ports:
    - port: 5672
      targetPort: 5672
      name: svc-port
    - port: 5673
      targetPort: 5673
      name: cluster-port
    - port: 15672
      targetPort: 15672
      name: dashboard-port
      