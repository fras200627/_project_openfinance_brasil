apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: substances-domain-services
  labels:
    app: substances-domain-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: substances-domain-pod
  template:
    metadata:
      name: substances-domain-pod
      labels:
        app: substances-domain-pod
    spec:
      containers:
        - name: substances-domain-container
          image: fras200627/substances-domain:1.0.0
          ports:
            - containerPort: 6007
          envFrom:
            - configMapRef:
                name: config-map-defaults
            - configMapRef:
                name: substances-domain-cmap  
          volumeMounts:
            - name: substances-domain-persist
              mountPath: /default/substances-domain-pvc
      volumes:
        - name: substances-domain-persist
          persistentVolumeClaim:
            claimName: substances-domain-pvc
  serviceName: substances-domain-services-stateful
    