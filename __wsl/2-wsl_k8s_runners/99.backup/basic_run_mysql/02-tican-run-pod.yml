apiVersion: v1
kind: Pod
metadata:
  name: db-mysql-pod
  labels:
    app: db-mysql-pod
spec:
  containers:
    - name: db-mysql-container
      image: mysql:8.0
      ports:
        - containerPort: 3306
      envFrom:
        - configMapRef:
            name: config-map-defaults
        - configMapRef:
            name: db-mysql-cmap
      volumeMounts:
        - name: db-mysql-persist
          mountPath: /default/db-mysql-pvc
  volumes:
    - name: db-mysql-persist
      persistentVolumeClaim:
        claimName: db-mysql-pvc