apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oauth2-clients-business-services
  labels:
    app: oauth2-clients-business-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-clients-business-pod
  template:
    metadata:
      name: oauth2-clients-business-pod
      labels:
        app: oauth2-clients-business-pod
    spec:
      containers:
        - name: oauth2-clients-business-container
          image: fras200627/oauth2-clients-business:1.0.0
          ports:
            - containerPort: 6004
          envFrom:
            - configMapRef:
                name: config-map-defaults
            - configMapRef:
                name: oauth2-clients-business-cmap  
          volumeMounts:
            - name: oauth2-clients-business-persist
              mountPath: /default/oauth2-clients-business-pvc
      volumes:
        - name: oauth2-clients-business-persist
          persistentVolumeClaim:
            claimName: oauth2-clients-business-pvc
  serviceName: oauth2-clients-business-services-stateful
    