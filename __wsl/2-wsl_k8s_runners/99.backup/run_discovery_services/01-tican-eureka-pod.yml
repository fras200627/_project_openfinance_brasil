# ---------------------------------------------------------------
# This script includes volume
# ---------------------------------------------------------------
apiVersion: v1
kind: Pod
metadata:
  name: tican-discovery-services-pod
  labels:
    app: tican-discovery-services-pod
spec:
  containers:
    - name: tican-discovery-services-pod
      image: fras200627/tican-discovery-services:1.0.0-openapi
      ports:
        - containerPort: 3000
      envFrom:
        - configMapRef:
            name: config-map-defaults
        - configMapRef:
            name: tican-discovery-services-cmap