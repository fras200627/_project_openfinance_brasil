      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    environment:
      spring.profiles.active: ${PROFILE_ACTIVE}
    networks:
      tican-services-network:
        ipv4_address: ${OAUTH2_REGISTERED_CLIENTS_BUSINESS_HOST_IP}
    volumes:
      - oauth2-registered-clients-business-data:${OAUTH2_REGISTERED_CLIENTS_BUSINESS_DATA_VOLUME}
      - oauth2-registered-clients-business-backup:${OAUTH2_REGISTERED_CLIENTS_BUSINESS_BACKUP_VOLUME}

  # Tican OAuth2 Users Business Service ###############################
  tican-users-domain-svc:
    image: ${OAUTH2_USERS_DOMAIN_IMAGE}
    hostname: ${OAUTH2_USERS_DOMAIN_HOST_NAME}
    domainname: ${DOCKER_DOMAIN_NAME}
    #    depends_on:
    #      - tican-service-discovery
    #      - tican-authentication-server
    #      - tican-api-gateway
    #      - db-tican-mysql
