  medical-products-business-data:
  medical-products-business-backup:
  audit-services-data:
  audit-services-backup:
networks:
  tican-services-network:
    ipam:
      config:
        - subnet: 10.0.0.0/16
          ip_range: 10.0.1.0/24
          gateway: 10.0.1.254
