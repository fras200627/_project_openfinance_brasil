        window: 120s
    environment:
      spring.profiles.active: ${PROFILE_ACTIVE}
    networks:
      tican-services-network:
        ipv4_address: ${OAUTH2_USERS_DOMAIN_HOST_IP}
    volumes:
      - oauth2-users-domain-data:${OAUTH2_USERS_DOMAIN_DATA_VOLUME}
      - oauth2-users-domain-backup:${OAUTH2_USERS_DOMAIN_BACKUP_VOLUME}

  # Tican OAuth2 Users Business Service ###############################
  tican-users-business-svc:
    image: ${OAUTH2_USERS_BUSINESS_IMAGE}
    hostname: ${OAUTH2_USERS_BUSINESS_HOST_NAME}
