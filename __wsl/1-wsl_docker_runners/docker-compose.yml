        ipv4_address: ${OAUTH2_USERS_BUSINESS_HOST_IP}
    volumes:
      - oauth2-users-business-data:${OAUTH2_USERS_BUSINESS_DATA_VOLUME}
      - oauth2-users-business-backup:${OAUTH2_USERS_BUSINESS_BACKUP_VOLUME}

  # Tican Medical Substances Domain Service ###############################
  tican-medical-substances-domain-svc:
    image: ${SUBSTANCES_DOMAIN_IMAGE}
    hostname: ${SUBSTANCES_DOMAIN_HOST_NAME}
    domainname: ${DOCKER_DOMAIN_NAME}
