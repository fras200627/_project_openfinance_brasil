apiVersion: v1
kind: Pod
metadata:
  name: tican-api-gateway-pod
  labels:
    app: tican-api-gateway-pod
spec:
  containers:
    - name: tican-api-gateway-pod
      image: fras200627/tican-api-gateway:1.0.3-openapi
      ports:
        - containerPort: 3001
      envFrom:
        - configMapRef:
            name: config-map-defaults
        - configMapRef:
            name: tican-api-gateway-cmap