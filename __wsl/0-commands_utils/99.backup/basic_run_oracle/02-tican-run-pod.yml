apiVersion: v1
kind: Pod
metadata:
  name: db-oracle-pod
  labels:
    app: db-oracle-pod
spec:
  containers:
    - name: db-oracle-container
      image: 'fras200627/db-tican-oracle:1.0.0'
      ports:
        - containerPort: 1521
      envFrom:
        - configMapRef:
            name: config-map-defaults
        - configMapRef:
            name: db-oracle-cmap
      volumeMounts:
        - name: db-oracle-persist
          mountPath: /default/db-oracle-pvc
  volumes:
    - name: db-oracle-persist
      persistentVolumeClaim:
        claimName: db-oracle-pvc