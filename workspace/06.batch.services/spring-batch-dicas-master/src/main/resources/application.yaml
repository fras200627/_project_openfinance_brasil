spring:
  datasource:
    driver-class-name: org.h2.Driver
    username: sa
    url: jdbc:h2:file:~/spring-boot-h2-db
    password: ''
  sql:
    init:
      mode: always
  h2:
    console:
      enabled: 'true'
      path: /h2
  batch:
    job:
      enabled: 'false'
  jpa:
    hibernate:
      ddl-auto: update
