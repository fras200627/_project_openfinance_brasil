openapi: 3.0.0
info:
  title: Batch Components - Open Finance Brasil
  description: ''
  version: 1.0.0
security:
  - bearerAuth: []
tags:
  - name: ApprovalBatch
paths:
  /consents/approval/batch/joblauncher:
    get:
      tags:
        - ApprovalBatch
      summary: Envia comando para execucao do job batch de consents approval
      operationId: executeJobLauncher
      parameters:
        - $ref: '#/components/parameters/Authorization'
      responses:
        '200':
          $ref: '#/components/responses/ResponseExecution'
components:
  schemas:
    ResponseExecution:
      type: object
      required:
        - data
        - meta
      properties:
        data:
          $ref: '#/components/schemas/ResponseJobInformations'
        meta:
          $ref: '#/components/schemas/Meta'
    ResponseJobInformations:
      type: object
      required:
        - jobInformations
      properties:
        jobInformations:
          $ref: '#/components/schemas/JobInformations'
    JobInformations:
      type: object
      required:
        - jobId
        - jobCreateTime
        - jobEndTime
        - jobExitStatus
      properties:
        jobId:
          type: string
          minLength: 11
          maxLength: 256
          example: "001"
        jobCreateTime:
          type: string
          minLength: 1
          maxLength: 50
          example: "2021-05-21T08:30:00Z"
        jobEndTime:
          type: string
          minLength: 1
          maxLength: 50
          example: "2021-05-21T08:30:00Z"
        jobExitStatus:
          type: string
          minLength: 1
          maxLength: 50
          example: "ok"
    Meta:
      type: object
      description: Meta informações referente à API requisitada.
      required:
        - requestDateTime
      properties:
        requestDateTime:
          description: 'Data e hora da execução, conforme especificação RFC-3339, formato UTC.'
          type: string
          maxLength: 20
          example: '2021-05-21T08:30:00Z'
  parameters:
    Authorization:
      name: Authorization
      in: header
      description: Cabeçalho HTTP padrão. Permite que as credenciais sejam fornecidas dependendo do tipo de recurso solicitado
      required: true
      schema:
        type: string
        maxLength: 2048
  responses:
    ResponseExecution:
      description: Informações sobre a execução do job
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResponseExecution'
  securitySchemes:
    bearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
