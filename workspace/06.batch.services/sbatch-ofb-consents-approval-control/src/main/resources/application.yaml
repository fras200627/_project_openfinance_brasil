spring:
  application:
    name: sbatch-ofb-consents-approval-control
  batch:
    jdbc:
#      initialize-schema: always # uses only first execution to create batch control tables
      initialize-schema: never
    job:
      enabled: false
    custom:
      chunk:
        size: 10
      thread:
        pool:
          size: 5
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: ${API_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${API_HIBERNATE_DDL_AUTO:none}
server:
  error:
    include-stacktrace: never
jwt:
  issuer: banco-tcn-openfinance-brasil
  private:
    key: classpath:keystore/app.private.key
  public:
    key: classpath:keystore/app.public.key
eureka:
  instance:
    hostname: ${DISCOVERY_SERVICES_APP_NAME:ofb-discovery-services}
    instance-id: ${spring.application.name}:${random.int}
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
logging:
  config: classpath:logback/logback-${spring.profiles.active}.xml
# Swagger page: http://localhost:5051/swagger-ui
springdoc:
  api-docs:
    enabled: true
  packagesToScan: com.ofb
  pathsToMatch: /**
  swagger-ui:
    enabled: true
    path: /swagger-ui
    disable-swagger-default-url: true
    show-common-extensions: true
    show-extensions: true
    operationsSorter: alpha
    tagsSorter: alpha

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:oracle:thin:@localhost:1521:XE
    jdbcUrl: jdbc:oracle:thin:@localhost:1521:XE
#    username: ${ORACLE_USER:OFB_USER}
#    password: ${ORACLE_PWD:ofb}
    username: ${ORACLE_USER:OFB}
    password: ${ORACLE_PWD:ofb}
    driver-class-name: oracle.jdbc.OracleDriver
    serverTimezone: America/Sao_Paulo
    useSSL: false
    hikari:
      connection-test-query: SELECT 1 FROM DUAL
      connectionTimeout: 30000
      idleTimeout: 30000
      maxLifetime: 2000000
      maximumPoolSize: 20
      minimumIdle: 5
      poolName: SpringBootJPAHikariCP
    type: com.zaxxer.hikari.HikariDataSource
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:3000/eureka
app:
  consents:
    approval:
      expires-in-minutes: 1
amqp:
  ofb:
    exchange-direct: "ofb.exchange.direct"
    audit:
      http-requests:
        queue: "ofb.audit.http.requests"
        routing-key: "audit.http.requests"
      consents-authorization:
        queue: "ofb.audit.consents.authorization"
        routing-key: "audit.consents.auth"
      consents-cancellation:
        queue: "ofb.audit.consents.cancellation"
        routing-key: "audit.consents.cancel"
      consents-revoke:
        queue: "ofb.audit.consents.revoke"
        routing-key: "audit.consents.revoke"
      consents-extends:
        queue: "ofb.audit.consents.extends"
        routing-key: "audit.consents.extends"
    consents:
      authorization:
        queue: "ofb.consents.authorization"
        routing-key: "exec.consents.auth"
      cancellation:
        queue: "ofb.consents.cancellation"
        routing-key: "exec.consents.cancel"
# The port can be fixed to "0" so that eureka-server determines a port dynamically
# but in this case access to Swagger-UI will not work
server:
  port: 3053 # set to "0" if you want eureka-server to determine a port dynamically
