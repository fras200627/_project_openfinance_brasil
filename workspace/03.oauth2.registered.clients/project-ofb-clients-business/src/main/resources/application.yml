spring:
  application:
    name: ofb-clients-business-api
#  session:
#    store-type: jdbc
#  security:
#    filter:
#      dispatcher-types: request
  jpa:
    properties:
      hibernate:
        format_sql: true    
    show-sql: ${API_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${API_HIBERNATE_DDL_AUTO:none}
server:
  error:
    include-stacktrace: never

jwt:
  issuer: banco-tcn-openfinance-brasil
  private:
    key: classpath:keystore/app.private.key
  public:
    key: classpath:keystore/app.public.key

# Custom properties
app:
  listOfServers: #server item: id, description, url
    - 0, 'OFB Server at LOCAL execution', http://localhost/3000
    - 1, 'OFB Server at DOCKER execution', http://localhost/5000
    - 2, 'OFB Server at K8S execution', http://localhost/7000
eureka:
  instance:
    hostname: ${DISCOVERY_SERVICES_APP_NAME:ofb-discovery-services}
    instance-id: ${spring.application.name}:${random.int}
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
resilience4j:
  circuitBreaker:
    instances:
      authServerDomain:
        waitDurationInOpenState: 50s
        minimumNumberOfCalls: 2
        slidingWindowSize: 3
logging:
  config: classpath:logback/logback-${spring.profiles.active}.xml

# Swagger page: http://localhost:3051/swagger-ui
springdoc:
  api-docs:
    enabled: true
  packagesToScan: com.ofb
  pathsToMatch: /**
  swagger-ui:
    enabled: true
    path: /swagger-ui
    disable-swagger-default-url: true
    show-common-extensions: true
    show-extensions: true
    operationsSorter: alpha
    tagsSorter: alpha

---
spring:
  config:
    activate:
      on-profile: local
#  security:
#    oauth2:
#      resource-server:
#        jwt:
#          issuer-uri: http://localhost:3001/ofb-auth-server
  datasource:
    url: jdbc:mysql://localhost:3306/user?createDatabaseIfNotExist=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_ROOT_PWD:root}
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:3000/eureka
amqp:
  audit_services:
    audit_queue: ${API_AMQP_AUDIT_QUEUE:ofb.audit.admin.queue}
    audit_exchange: ${API_AMQP_AUDIT_EX:ofb.audit.admin.ex}
    audit_dlq: ${API_AMQP_AUDIT_DLQ:ofb.audit.admin.dlq}
    audit_dlx: ${API_AMQP_AUDIT_DLX:ofb.audit.admin.dlx}
# The port can be fixed to "0" so that eureka-server determines a port dynamically
# but in this case access to Swagger-UI will not work
server:
  port: 3051 # set to "0" if you want eureka-server to determine a port dynamically
