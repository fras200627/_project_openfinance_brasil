openapi: 3.0.3
info:
  title: 'Project OFB - OpenAPI 3.0.3'
  description: 'Project OFB using Open API'
  version: 1.0.0
  termsOfService: http://swagger.io/terms/
  contact:
    email: fras200627@gmail.com
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
tags:
  - name: app.check
    description: 'App Check Resources'
paths:
  /health:
    get:
      tags:
        - app.check
      summary: 'Check if the app is running'
      description: 'Check if the app is running'
      operationId: getAppHealth
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/ResponseCode200Template'
        '400':
          $ref: '#/components/responses/ResponseCode400Template'
        '404':
          $ref: '#/components/responses/ResponseCode404Template'
  /actuator/info:
    get:
      tags:
        - app.check
      summary: Check the information of the running app
      description: 'Check the information of the running app'
      operationId: getAppInfo
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/ResponseCode200Template'
        '400':
          $ref: '#/components/responses/ResponseCode400Template'
        '404':
          $ref: '#/components/responses/ResponseCode404Template'
components:
  # block-01 :: PARAMETERS ############################################################
  parameters:
    # Global parameters #
    PageNumber:
      name: pageNumber
      in: query
      description: 'Page Number'
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 999999
        default: 1
        nullable: false
    PageSize:
      name: pageSize
      in: query
      description: 'Page Size'
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
        default: 20
        nullable: false
    PageSortFieldRegEx:
      name: pageSortField
      in: query
      description: 'Field used for sorting on pages (regex)'
      required: true
      schema:
        type: string
        pattern: '(ticket|requestUri|requestMethod|requestUserName|requestTime)'
        default: 'ticket'
        nullable: false
    PageSortOrderRegEx:
      name: pageSortOrder
      in: query
      description: "Required is: 'ASC or DESC' (regex)"
      required: true
      schema:
        type: string
        pattern: '(asc|Asc|ASC|desc|Desc|DESC)'
        default: 'ASC'
        nullable: false
    TicketNumber:
      name: ticketNumber
      in: query
      description: 'ID of Ticket number'
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        maximum: 999999999
        nullable: false

  # block-02 :: SCHEMAS ##############################################################
  schemas:
    Code200Template:
      type: object
      properties:
        code:
          type: integer
          default: 200
        message:
          type: string
          default: 'message description'
    Code400Template:
      type: object
      properties:
        code:
          type: integer
          default: 400
        message:
          type: string
          default: 'message description'
    Code404Template:
      type: object
      properties:
        code:
          type: integer
          default: 404
        message:
          type: string
          default: 'message description'

  # block-03 :: RESPONSES ##############################################################
  responses:
    # Global responses #
    ResponseCode200Template:
      description: 'Execution completed successfully.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code200Template'
    ResponseCode400Template:
      description: 'Bad request operation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code400Template'
    ResponseCode404Template:
      description: 'Path or object not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code404Template'
