openapi: 3.0.1
info:
  title: 'OFB Authentication Server'
  description: 'Authentication Server for OFB'
  version: 1.0.0
tags:
  - name: app.authentication.resources
    description: 'App Authentication Resources'
paths:
  /oauth2/token:
    post:
      tags:
        - app.authentication.resources
      summary: 'Generate a Access Token for a Registered Client Authenticate'
      description: 'Generate a Access Token for a Registered Client'
      operationId: postOauth2Token
      security:
        - basicAuth: []
      parameters: []
      responses:
        '200':
          $ref: '#/components/responses/TokenResponseModel'
        '400':
          $ref: '#/components/responses/ResponseCode400Template'
        '401':
          $ref: '#/components/responses/ResponseCode401Template'
        '403':
          $ref: '#/components/responses/ResponseCode403Template'
        '404':
          $ref: '#/components/responses/ResponseCode404Template'
        '500':
          $ref: '#/components/responses/ResponseCode500Template'
        default:
          $ref: '#/components/responses/ResponseCodeDefaultTemplate'
  /oauth2/accessToken:
    get:
      tags:
        - app.authentication.resources
      summary: 'Generate a Access Token for a get consent informations'
      description: 'Generate a Access Token for a get consent informations'
      operationId: getAccessToken
      security:
        - bearerAuth: []
      parameters:
        - name: consentId
          $ref: '#/components/parameters/ConsentId'
      responses:
        '200':
          $ref: '#/components/responses/TokenResponseModel'
        '400':
          $ref: '#/components/responses/ResponseCode400Template'
        '401':
          $ref: '#/components/responses/ResponseCode401Template'
        '403':
          $ref: '#/components/responses/ResponseCode403Template'
        '404':
          $ref: '#/components/responses/ResponseCode404Template'
        '500':
          $ref: '#/components/responses/ResponseCode500Template'
        default:
          $ref: '#/components/responses/ResponseCodeDefaultTemplate'
components:
  parameters:
    ConsentId:
      name: consentId
      description: 'Consent Id in format OFB. Example: urn:banco-xxx:42a60be9-6483-4ae2-9d0e-887aae23d0a7'
      in: header
      required: true
      schema:
        type: string
        minLength: 50
        maxLength: 50
        nullable: false
  schemas:
    TokenResponseModelTemplate:
      type: object
      properties:
        access_token:
          type: string
          default: 'access token value'
        scope:
          type: string
          default: 'scope permissions list'
        token_type:
          type: string
          default: 'token type value'
        expires_in:
          type: integer
          default: 'expires token in... (seconds)'
    Code200Template:
      type: object
      properties:
        code:
          type: integer
          default: 200
        message:
          type: string
          default: 'message description'
    Code201Template:
      type: object
      properties:
        code:
          type: integer
          default: 201
        message:
          type: string
          default: 'message description'
    Code202Template:
      type: object
      properties:
        code:
          type: integer
          default: 202
        message:
          type: string
          default: 'message description'
    Code400Template:
      type: object
      properties:
        code:
          type: integer
          default: 400
        message:
          type: string
          default: 'message description'
    Code401Template:
      type: object
      properties:
        code:
          type: integer
          default: 401
        message:
          type: string
          default: 'message description'
    Code403Template:
      type: object
      properties:
        code:
          type: integer
          default: 403
        message:
          type: string
          default: 'message description'
    Code404Template:
      type: object
      properties:
        code:
          type: integer
          default: 404
        message:
          type: string
          default: 'message description'
    Code500Template:
      type: object
      properties:
        code:
          type: integer
          default: 500
        message:
          type: string
          default: 'message description'
    CodeDefaultTemplate:
      type: object
      properties:
        code:
          type: integer
          default: 501
        message:
          type: string
          default: 'message description'
  responses:
    # Global responses #
    TokenResponseModel:
      description: ''
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TokenResponseModelTemplate'
    ResponseCode200Template:
      description: 'Execution completed successfully.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code200Template'
    ResponseCode201Template:
      description: 'Execution completed successfully.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code201Template'
    ResponseCode202Template:
      description: 'Execution completed successfully.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code202Template'
    ResponseCode400Template:
      description: 'Bad request operation'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code400Template'
    ResponseCode401Template:
      description: 'Unauthorized'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code401Template'
    ResponseCode403Template:
      description: 'Forbidden'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code403Template'
    ResponseCode404Template:
      description: 'Path or object not found'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code404Template'
    ResponseCode500Template:
      description: 'Internal Server Error'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Code500Template'
    ResponseCodeDefaultTemplate:
      description: 'Not Implemented'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CodeDefaultTemplate'
  securitySchemes:
    bearerAuth:
      type: http
      bearerFormat: JWT
      scheme: bearer
    basicAuth:
      type: http
      scheme: basic