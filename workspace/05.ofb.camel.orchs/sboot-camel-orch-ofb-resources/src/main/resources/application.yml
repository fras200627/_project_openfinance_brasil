spring:
  application:
    name: ofb-orch-resources
camel:
  springboot:
    name: ServicesRest
endpoints:
  enabled: false
  health:
    enabled: true
quickstart:
  generateOrderPeriod: 10s
  processOrderPeriod: 30s
server:
  error:
    include-stacktrace: never
jwt:
  issuer: banco-tcn-openfinance-brasil
  private:
    key: classpath:keystore/app.private.key
  public:
    key: classpath:keystore/app.public.key

# Custom properties
app:
  consents:
    organization: 'Banco TCN - OpenFinance Brasil'
    consent-id-urn-use: 'bancotcn'
  listOfServers: #server item: id, description, url
    - 0, 'OFB Server at LOCAL execution', http://localhost/3000
    - 1, 'OFB Server at DOCKER execution', http://localhost/5000
    - 2, 'OFB Server at K8S execution', http://localhost/7000
eureka:
  instance:
    hostname: ${DISCOVERY_SERVICES_APP_NAME:ofb-discovery-services}
    instance-id: ${spring.application.name}:${random.int}
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true
resilience4j:
  circuitBreaker:
    instances:
      authServerDomain:
        waitDurationInOpenState: 50s
        minimumNumberOfCalls: 2
        slidingWindowSize: 3
logging:
  config: classpath:logback/logback-${spring.profiles.active}.xml

# Swagger page: http://localhost:5041/swagger-ui
springdoc:
  api-docs:
    enabled: true
  packagesToScan: com.ofb
  pathsToMatch: /**
  swagger-ui:
    enabled: true
    path: /swagger-ui
    disable-swagger-default-url: true
    show-common-extensions: true
    show-extensions: true
    operationsSorter: alpha
    tagsSorter: alpha

---
spring:
  config:
    activate:
      on-profile: local
#  datasource:
#    url: jdbc:oracle:thin:@localhost:1521:XE
#    username: OFB_USER
#    password: ofb
#    driver-class-name: oracle.jdbc.OracleDriver
#    serverTimezone: America/Sao_Paulo
#    useSSL: false
#    hikari:
#      connection-test-query: SELECT 1 FROM DUAL
#      connectionTimeout: 30000
#      idleTimeout: 30000
#      maxLifetime: 2000000
#      maximumPoolSize: 20
#      minimumIdle: 5
#      poolName: SpringBootJPAHikariCP
#    type: com.zaxxer.hikari.HikariDataSource

app:
  paths:
    clients:
      ofb-consents: 'http://localhost:3001/ofb-consents/'
      ofb-resources: 'http://localhost:3001/ofb-resources/'
      ofb-authorization: 'http://localhost:3001/ofb-authorization-server/'

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:3000/eureka
amqp:
  ofb:
    exchange-direct: "ofb.exchange.direct"
    audit:
      http-requests:
        queue: "ofb.audit.http.requests"
        routing-key: "audit.http.requests"
      consents-authorization:
        queue: "ofb.audit.consents.authorization"
        routing-key: "audit.consents.auth"
      consents-cancellation:
        queue: "ofb.audit.consents.cancellation"
        routing-key: "audit.consents.cancel"
      consents-revoke:
        queue: "ofb.audit.consents.revoke"
        routing-key: "audit.consents.revoke"
      consents-extends:
        queue: "ofb.audit.consents.extends"
        routing-key: "audit.consents.extends"
    consents:
      authorization:
        queue: "ofb.consents.authorization"
        routing-key: "exec.consents.auth"
      cancellation:
        queue: "ofb.consents.cancellation"
        routing-key: "exec.consents.cancel"
# The port can be fixed to "0" so that eureka-server determines a port dynamically
# but in this case access to Swagger-UI will not work
server:
  port: 5033 # set to "0" if you want eureka-server to determine a port dynamically
