  config:
    activate:
      on-profile: docker
server:
  port: 3001
eureka:
  client:
    serviceUrl:
      defaultZone: http://10.0.1.1:3000/eureka
amqp:
  audit_services:
    audit_queue: ${API_AMQP_AUDIT_QUEUE:ofb.audit.queue}
