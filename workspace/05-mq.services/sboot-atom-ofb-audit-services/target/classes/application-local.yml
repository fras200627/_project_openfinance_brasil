server:
  port: 3301
spring:
  application:
    name: ofb-audit-services
  security:
    filter:
      dispatcher-types: request
  datasource:
      url: jdbc:mysql://localhost:3306/ofb?serverTimezone=UTC
      driver-class-name: com.mysql.cj.jdbc.Driver
      username: ${MYSQL_USER:root}
      password: ${MYSQL_ROOT_PWD:root}
  jpa:
    properties:
      hibernate:
        format_sql: true
    show-sql: ${API_JPA_SHOW_SQL:true}
    hibernate:
      ddl-auto: ${API_HIBERNATE_DDL_AUTO:none}  
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        retry:
          enable: true
          max-attempts: 2
          initial-interval: 3000
          max-interval: 10000
          multiplier: 2

jwt:
  issuer: banco-tcn-openfinance-brasil
  private:
    key: classpath:keystore/app.private.key
  public:
    key: classpath:keystore/app.public.key

app:
  listOfServers: #server item: id, description, url
    - 0, 'Tican Server at LOCAL execution', http://localhost/3000
    - 1, 'Tican Server at DOCKER execution', http://localhost/5000
    - 2, 'Tican Server at K8S execution', http://localhost/7000

eureka:
  instance:
    hostname: ofb-discovery-services
    instance-id: ${spring.application.name}:${random.int}
    prefer-ip-address: true
  client:
    fetch-registry: true
    register-with-eureka: true

resilience4j:
  circuitBreaker:
    instances:
      auditServices:
        waitDurationInOpenState: 50s
        minimumNumberOfCalls: 2
        slidingWindowSize: 3
    
amqp:
  audit_services:
    queue: ofb.audit.queue
    exchange: ofb.audit.ex
    dlq: ofb.audit.dlq
    dlx: ofb.audit.dlx
  ofb_consents_cancel:
    queue: ofb.consents.cancel.queue
    exchange: ofb.consents.cancel.ex
    dlq: ofb.consents.cancel.dlq
    dlx: ofb.consents.cancel.dlx
  ofb_consents_authorization:
    queue: ofb.consents.auth.queue
    exchange: ofb.consents.auth.ex
    dlq: ofb.consents.authn.dlq
    dlx: ofb.consents.auth.dlx

logging:
  config: classpath:logback/logback-${spring.profiles.active}.xml

springdoc:
  api-docs:
    enabled: true
  packagesToScan: com.ofb
  pathsToMatch: /**
  swagger-ui:
    enabled: true
    path: /swagger-ui
    disable-swagger-default-url: true
    show-common-extensions: true
    show-extensions: true
    operationsSorter: alpha
    tagsSorter: alpha
